spring.application.name=SuggestFullText
spring.datasource.url=${SUGGEST_DB_URL}
spring.datasource.username=${SUGGEST_DB_USER}
spring.datasource.password=${SUGGEST_DB_PASS}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB